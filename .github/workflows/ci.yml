name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    name: "Linux · clean build (warnings-as-errors) + tests"
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Build with warnings treated as errors
        run: swift build -Xswiftc -warnings-as-errors
      - name: Run test suite
        run: swift test

  macos:
    name: "macOS · tests + iOS Simulator compile check"
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Run test suite (macOS)
        run: swift test
      - name: List package schemes (diagnostic aid if the build step fails)
        run: xcodebuild -list
      - name: Compile for generic iOS Simulator
        # Scheme is the PACKAGE name: Xcode auto-generates one scheme per package
        # named after the package, not the product (verified via -list on CI).
        # generic/platform deliberately avoids pinning to a named simulator
        # device: runner images do not guarantee any specific runtime.
        run: xcodebuild build -scheme deadline-slo-kit -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
